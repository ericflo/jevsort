<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ page.title | default: site.title }} · pairsort</title>
<meta name="description" content="{{ site.description }}">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body class="doc">
<header class="top">
  <a class="brand" href="{{ '/' | relative_url }}">pairsort</a>
  <nav>
    <a href="{{ '/quickstart.html' | relative_url }}">Quickstart</a>
    <a href="{{ '/usage.html' | relative_url }}">Usage</a>
    <a href="{{ '/how-it-works.html' | relative_url }}">How it works</a>
    <a href="{{ '/judges.html' | relative_url }}">Judges</a>
    <a href="{{ '/evals.html' | relative_url }}">Evals</a>
    <a href="{{ '/summary-showdown.html' | relative_url }}">Showdown</a>
    <a href="https://github.com/ericflo/pairsort">GitHub</a>
  </nav>
</header>
<main class="prose">
{{ content }}
</main>
<footer>
  <p><a href="{{ '/' | relative_url }}">Home</a> · <a href="{{ '/quickstart.html' | relative_url }}">Quickstart</a> ·
    <a href="{{ '/usage.html' | relative_url }}">Usage</a> · <a href="{{ '/how-it-works.html' | relative_url }}">How it works</a> ·
    <a href="{{ '/judges.html' | relative_url }}">Judges</a> · <a href="{{ '/evals.html' | relative_url }}">Evals</a> ·
    <a href="{{ '/summary-showdown.html' | relative_url }}">Summary Showdown</a> · <a href="{{ '/humans-vs-judges.html' | relative_url }}">Humans vs judges</a> ·
    MIT · <a href="https://github.com/ericflo/pairsort">github.com/ericflo/pairsort</a></p>
</footer>
<script>
  // phones: wide tables reflow into cards (each cell labelled with its column); figures open full-size on tap
  document.querySelectorAll(".prose table").forEach((t) => {
    const heads = [...t.querySelectorAll("thead th")].map((th) => th.textContent.trim());
    if (heads.length < 4) return;
    t.classList.add("stack");
    t.querySelectorAll("tbody tr").forEach((tr) => [...tr.children].forEach((td, i) => td.setAttribute("data-label", heads[i] || "")));
  });
  document.querySelectorAll(".prose img").forEach((img) => {
    img.classList.add("zoomable");
    img.addEventListener("click", () => {
      const o = document.createElement("div");
      o.className = "zoom-overlay";
      o.append(Object.assign(document.createElement("img"), { src: img.src, alt: img.alt }));
      o.addEventListener("click", () => o.remove());
      document.body.append(o);
    });
  });
</script>
<script type="module">
  const blocks = document.querySelectorAll("pre code.language-mermaid");
  if (blocks.length) {
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs");
    blocks.forEach((c) => { const d = document.createElement("div"); d.className = "mermaid"; d.textContent = c.textContent; c.parentElement.replaceWith(d); });
    mermaid.initialize({ startOnLoad: false, theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "neutral" });
    await mermaid.run();
  }
</script>
</body>
</html>
