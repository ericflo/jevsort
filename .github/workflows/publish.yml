name: publish
# Publishes to PyPI with trusted publishing (OIDC): no API token is stored anywhere.
# The PyPI project is "pairsort" (import name and CLI stay `jevsort`; a `pairsort` CLI alias is also installed).
# One-time setup on pypi.org: add a "pending publisher" for PyPI project "pairsort" with
#   owner: ericflo · repository: jevsort · workflow: publish.yml · environment: pypi
# (and the same on test.pypi.org with environment: testpypi, for dry runs)
# Then release by pushing a tag that matches the version in pyproject.toml:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "testpypi or pypi"
        default: testpypi
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: smoke-test the wheel in a clean venv
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          /tmp/w/bin/jevsort --version
          /tmp/w/bin/pairsort --version
          /tmp/w/bin/jevsort demo --offline -q | tail -1
          /tmp/w/bin/python -c "import jevsort; print(jevsort.sort(['a','bbb','cc'], 'Which is longer?', judge=lambda q,a,b: len(a)>len(b)).sorted)"
      - name: run the tests from the sdist
        run: |
          mkdir /tmp/s && tar xzf dist/*.tar.gz -C /tmp/s --strip-components=1
          cd /tmp/s && python -m venv .v && .v/bin/pip install '.[dev]' && .v/bin/pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pairsort
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
