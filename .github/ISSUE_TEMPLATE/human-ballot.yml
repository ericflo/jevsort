name: Human ballot (Summary Showdown)
description: Submit your pairwise votes from the Summary Showdown site. The site fills this in for you.
title: "Ballot: "
labels: ["human-ballot"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for judging! This ballot was generated by the [Summary Showdown](https://ericflo.github.io/pairsort/) page.
        It contains only your pairwise picks (which summary you preferred, on which question) — nothing else.
        Just press **Submit new issue**. `pairsort agreement` reads these issues to build the human-vs-judge agreement graph.
  - type: textarea
    id: ballot
    attributes:
      label: Ballot JSON
      description: Generated by the site. Please don't edit the votes.
      render: json
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything you noticed? (optional)
      description: e.g. a summary that was confidently wrong, or a question that was hard to answer.
    validations:
      required: false
